name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Codecov upload authenticates with a GitHub OIDC token, so the repository needs no Codecov token secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: py314-dj60-pg17
            python: "3.14"
            postgres: "17"
            codecov: true
          - toxenv: py314-dj60-pg18
            python: "3.14"
            postgres: "18"
          - toxenv: py314-dj60-pgtrigger
            python: "3.14"
            postgres: "17"
          - toxenv: py314-dj61-pg17
            python: "3.14"
            postgres: "17"
          - toxenv: py314-dj61-pg18
            python: "3.14"
            postgres: "18"
          - toxenv: py314-dj61-pgtrigger
            python: "3.14"
            postgres: "17"
          - toxenv: py315-dj61-pg17
            python: "3.15"
            postgres: "17"
          - toxenv: py315-dj61-pg18
            python: "3.15"
            postgres: "18"
          - toxenv: py315-dj61-pgtrigger
            python: "3.15"
            postgres: "17"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.21'
      - run: tox -e ${{ matrix.toxenv }}
      # Only one job uploads, so that the badge shows the coverage of one run. The upload also runs when the test env
      # fails the coverage gate, so that the badge shows the drop. The test env writes coverage.xml before it checks the
      # gate.
      - if: ${{ !cancelled() && matrix.codecov }}
        uses: codecov/codecov-action@v5
        with:
          files: tests/coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.21'
      - run: tox -e ruff

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml
      - run: python -m pip install --upgrade pip pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.21'
      - run: tox -e docs

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.21'
      - run: tox -e build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/django-postgres-objects
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
