[build-system]
# The PEP 639 license expression below needs 77, which is also new enough not to want `wheel` declared here.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-postgres-objects"
dynamic = ["version"]
description = "Declare PostgreSQL functions and other non-table objects as classes, and let makemigrations manage them."
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "DjanQuiltDB Project", email = "djanquiltdb@portal42.net" },
]
keywords = [
    "django",
    "database",
    "postgresql",
    "migrations",
    "functions",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2.19,<7.0",
]

[project.urls]
Homepage = "https://github.com/djanquiltdb/django-postgres-objects"
Documentation = "https://django-postgres-objects.readthedocs.io/"
Source = "https://github.com/djanquiltdb/django-postgres-objects"
Issues = "https://github.com/djanquiltdb/django-postgres-objects/issues"
Changelog = "https://github.com/djanquiltdb/django-postgres-objects/blob/master/CHANGELOG.rst"

[project.optional-dependencies]
lint = [
    "ruff==0.15.21",
]
test = [
    "coverage",
    "psycopg[binary]>=3.0.0",
    "dj-database-url",
]
docs = [
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3.1,<4",
    "sphinx-reredirects>=1.1,<2",
]
dev = [
    "django-postgres-objects[test,lint,docs]",
    "pre-commit",
    # The generated environment list and the factor conditions in [tool.tox] need 4.56.1.
    "tox>=4.56.1",
    "build",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "postgres_objects.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The marker is what makes the inline annotations visible to a consumer's type checker.
postgres_objects = ["py.typed"]

[tool.tox]
requires = ["tox>=4.56.1"]
# The test environments: each suite (core, and the pgtrigger checks) on each combination of Python, Django and
# PostgreSQL in this list. The env_run_base below chooses the settings of each environment by the factors of its name,
# so a combination needs no section of its own.
#
# Each Django the classifiers claim gets its own leg. A range wide enough to cover both would silently resolve to the
# newest one and leave the older claim untested, so every dj-- factor is pinned to exactly the minor it names.
# Python 3.15 runs on Django 6.1 only. Django 6.0 does not support Python 3.15, and Django 6.1 supports it from 6.1.3.
# Django 5.2 runs on Python 3.12 to 3.14, since it does not support Python 3.15.
# Each combination runs on PostgreSQL 18, and only the newest one also runs on PostgreSQL 17, because the Python and
# Django versions do not change how PostgreSQL behaves.
env_list = [
    { product = [
        ["core", "pgtrigger"],
        [
            "py312-dj52-pg18",
            "py312-dj60-pg18",
            "py312-dj61-pg18",
            "py313-dj52-pg18",
            "py313-dj60-pg18",
            "py313-dj61-pg18",
            "py314-dj52-pg18",
            "py314-dj60-pg18",
            "py314-dj61-pg18",
            "py315-dj61-pg17",
            "py315-dj61-pg18",
        ],
    ] },
    "ruff",
    "docs",
]

[tool.tox.env_run_base]
description = { replace = "if", condition = "factor.pgtrigger", then = "Check that this package and django-pgtrigger share the migration commands", "else" = "Run the test suite against the Python, Django and PostgreSQL versions that the environment name gives" }
# A test environment takes its Python from its name. The other environments run on Python 3.14.
default_base_python = ["python3.14"]
package = "editable"
extras = ["test"]
change_dir = "tests"
pass_env = ["DATABASE_URL"]
deps = [
    { replace = "if", condition = "factor.dj52", then = ["Django>=5.2.19,<5.3"], extend = true },
    { replace = "if", condition = "factor.dj60", then = ["Django>=6.0,<6.1"], extend = true },
    { replace = "if", condition = "factor.dj61 and not factor.py315", then = ["Django>=6.1,<6.2"], extend = true },
    # Django supports Python 3.15 from 6.1.3.
    { replace = "if", condition = "factor.dj61 and factor.py315", then = ["Django>=6.1.3,<6.2"], extend = true },
    { replace = "if", condition = "factor.pgtrigger", then = ["django-pgtrigger>=4.17,<5"], extend = true },
]
# The pg17/pg18 factor picks the database server from docker-compose.yml; DATABASE_URL can still be overridden from the
# outside.
set_env = { replace = "if", condition = "factor.pg17 or factor.pg18", then = { DJANGO_SETTINGS_MODULE = { replace = "if", condition = "factor.pgtrigger", then = "config.settings_pgtrigger", "else" = "config.settings" }, PYTHONWARNINGS = "default", DATABASE_URL = { replace = "if", condition = "factor.pg17", then = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}", "else" = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres18:5432/test_db}" } }, "else" = { DJANGO_SETTINGS_MODULE = "config.settings", PYTHONWARNINGS = "default" } }
commands = [
    { replace = "if", condition = "not factor.pgtrigger", then = [
        [
            "coverage",
            "run",
            "--rcfile={tox_root}/pyproject.toml",
            "manage.py",
            "test",
            "--noinput",
            { replace = "posargs", extend = true, default = [] },
        ],
        # CI uploads coverage.xml to Codecov. It is written before the report and without the gate, so that it exists
        # when coverage is below the gate, which fails the report.
        ["coverage", "xml", "--fail-under=0", "--rcfile={tox_root}/pyproject.toml"],
        ["coverage", "report", "--rcfile={tox_root}/pyproject.toml"],
    ], extend = true },
    # Once per ordering of the two apps, since which is readied first decides which layers its autodetection on top.
    { replace = "if", condition = "factor.pgtrigger", then = [
        ["python", "manage.py", "test", "test_pgtrigger", "--noinput"],
        ["python", "manage.py", "test", "test_pgtrigger", "--noinput", "--settings=config.settings_pgtrigger_first"],
    ], extend = true },
]

[tool.tox.env.ruff]
description = "Lint and check formatting"
skip_install = true
extras = []
deps = ["ruff==0.15.21"]
change_dir = "{tox_root}"
commands = [
    ["ruff", "check", "src", "tests", "docs"],
    ["ruff", "format", "--check", "src", "tests", "docs"],
]

[tool.tox.env.docs]
description = "Build the documentation"
extras = ["docs"]
change_dir = "{tox_root}"
commands = [["sphinx-build", "-b", "html", "-W", "docs", "docs/_build/html"]]

[tool.tox.env.build]
description = "Build the sdist and wheel and check the metadata"
skip_install = true
extras = []
deps = ["build", "twine"]
change_dir = "{tox_root}"
commands = [
    # `build` leaves whatever is already in dist/ alone, and the twine check below globs the whole directory, so an
    # earlier version's artefacts would be checked here and uploaded by a later `twine upload dist/*`.
    ["python", "-c", "import shutil; shutil.rmtree('dist', ignore_errors=True)"],
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
]

[tool.coverage.run]
source = ["postgres_objects"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 97
exclude_also = [
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    # isort
    "I",
    # docstrings and comments longer than max-doc-length
    "W505",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
