[tox]
envlist =
    py314-dj60-pg17
    py314-dj60-pg18
    ruff

[testenv]
description = Run the test suite against the installed package
usedevelop = True
extras = test
deps =
    Django>=6.0,<7.0
changedir = tests
passenv =
    DATABASE_URL
setenv =
    DJANGO_SETTINGS_MODULE = config.settings
    PYTHONWARNINGS = default
allowlist_externals =
    coverage
commands =
    coverage run --rcfile={toxinidir}/pyproject.toml manage.py test --noinput {posargs}
    coverage report --rcfile={toxinidir}/pyproject.toml

[testenv:py314-dj60-pg17]
basepython = python3.14
setenv =
    {[testenv]setenv}
    DATABASE_URL = {env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}

[testenv:py314-dj60-pg18]
basepython = python3.14
setenv =
    {[testenv]setenv}
    DATABASE_URL = {env:DATABASE_URL:postgresql://postgres:postgres@postgres18:5432/test_db}

[testenv:ruff]
description = Lint and check formatting
basepython = python3.14
skip_install = true
extras =
deps =
    ruff==0.15.21
changedir = {toxinidir}
allowlist_externals =
    ruff
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:build]
description = Build the sdist and wheel and check the metadata
basepython = python3.14
skip_install = true
extras =
deps =
    build
    twine
changedir = {toxinidir}
commands =
    python -m build
    twine check dist/*
